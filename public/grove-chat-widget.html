<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grove Media Chat Widget</title>
    <style>
        /* 
         * Grove Media Chat Widget Styles
         * Theme: Ultra Modern Dark Mode (High-End Agency)
         */
        :root {
            --gm-black: #050505;
            --gm-dark-gray: #121212;
            --gm-medium-gray: #1f1f1f;
            --gm-light-gray: #333333;
            --gm-text-white: #ffffff;
            --gm-text-gray: #a1a1a1;
            --gm-accent: #ffffff;
            --gm-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            --gm-transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            --gm-font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            font-family: var(--gm-font);
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            /* Demo background */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Widget Container */
        #gm-widget-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            font-family: var(--gm-font);
            text-align: left;
        }

        /* Floating Button */
        #gm-chat-trigger {
            width: 60px;
            height: 60px;
            background-color: var(--gm-black);
            border-radius: 50%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: var(--gm-transition);
            border: 1px solid var(--gm-medium-gray);
        }

        #gm-chat-trigger:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            border-color: var(--gm-light-gray);
        }

        #gm-chat-trigger svg {
            width: 24px;
            height: 24px;
            fill: var(--gm-text-white);
            transition: var(--gm-transition);
        }

        /* Cross Icon Animation */
        #gm-chat-trigger.open svg {
            transform: rotate(45deg);
        }

        /* Chat Window */
        #gm-chat-window {
            position: absolute;
            bottom: 80px;
            right: 0;
            width: 380px;
            height: 600px;
            background-color: var(--gm-black);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--gm-shadow);
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px) scale(0.95);
            transition: var(--gm-transition);
            border: 1px solid var(--gm-medium-gray);
            display: flex;
            flex-direction: column;
        }

        /* Open State */
        #gm-chat-window.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        /* Header */
        .gm-header {
            padding: 24px;
            background: rgba(18, 18, 18, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--gm-medium-gray);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
        }

        .gm-header h2 {
            margin: 0;
            font-size: 16px;
            font-weight: 500;
            color: var(--gm-text-white);
            letter-spacing: 0.5px;
        }

        .gm-header-status {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .gm-status-dot {
            width: 8px;
            height: 8px;
            background-color: #2ecc71;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.4);
        }

        .gm-status-text {
            font-size: 11px;
            color: var(--gm-text-gray);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Screens */
        .gm-screen {
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-color: var(--gm-black);
            transition: var(--gm-transition);
            display: flex;
            flex-direction: column;
            padding-top: 70px;
            /* Header height */
            box-sizing: border-box;
        }

        .gm-screen.hidden {
            transform: translateX(100%);
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
        }

        .gm-screen.active {
            transform: translateX(0);
            opacity: 1;
        }

        /* Lead Form */
        #gm-form-screen {
            padding: 40px;
            justify-content: center;
            padding-top: 0;
            /* Center vertically */
        }

        .gm-welcome-title {
            color: var(--gm-text-white);
            font-size: 24px;
            font-weight: 300;
            margin-bottom: 10px;
        }

        .gm-welcome-subtitle {
            color: var(--gm-text-gray);
            font-size: 14px;
            font-weight: 400;
            line-height: 1.5;
            margin-bottom: 40px;
        }

        .gm-input-group {
            margin-bottom: 20px;
        }

        .gm-input {
            width: 100%;
            background: var(--gm-dark-gray);
            border: 1px solid var(--gm-medium-gray);
            color: var(--gm-text-white);
            padding: 16px;
            font-size: 14px;
            border-radius: 12px;
            outline: none;
            transition: var(--gm-transition);
            box-sizing: border-box;
        }

        .gm-input:focus {
            border-color: var(--gm-text-white);
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
        }

        .gm-button {
            width: 100%;
            background: var(--gm-text-white);
            color: var(--gm-black);
            border: none;
            padding: 16px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--gm-transition);
            margin-top: 10px;
        }

        .gm-button:hover {
            background-color: #e0e0e0;
            transform: translateY(-2px);
        }

        /* Chat Interface */
        #gm-chat-history {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        #gm-chat-history::-webkit-scrollbar {
            width: 4px;
        }

        #gm-chat-history::-webkit-scrollbar-thumb {
            background-color: var(--gm-light-gray);
            border-radius: 2px;
        }

        .gm-message {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            position: relative;
            animation: slideUp 0.3s ease-out forwards;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .gm-message-bot {
            background-color: var(--gm-dark-gray);
            color: var(--gm-text-white);
            border-bottom-left-radius: 4px;
            align-self: flex-start;
            border: 1px solid var(--gm-medium-gray);
        }

        .gm-message-user {
            background-color: var(--gm-text-white);
            color: var(--gm-black);
            border-bottom-right-radius: 4px;
            align-self: flex-end;
            font-weight: 500;
        }

        .gm-input-area {
            padding: 20px;
            background-color: var(--gm-black);
            border-top: 1px solid var(--gm-medium-gray);
            display: flex;
            gap: 10px;
        }

        #gm-message-input {
            flex: 1;
            background: var(--gm-dark-gray);
            border: 1px solid var(--gm-medium-gray);
            color: var(--gm-text-white);
            padding: 12px 16px;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            transition: var(--gm-transition);
        }

        #gm-message-input:focus {
            border-color: var(--gm-text-gray);
        }

        #gm-send-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: var(--gm-transition);
        }

        #gm-send-btn svg {
            width: 20px;
            height: 20px;
            fill: var(--gm-text-white);
        }

        #gm-send-btn:hover {
            background-color: var(--gm-dark-gray);
        }

        /* Typing Indicator */
        .gm-typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background-color: var(--gm-dark-gray);
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            align-self: flex-start;
            border: 1px solid var(--gm-medium-gray);
            margin-bottom: 10px;
            opacity: 0;
            display: none;
        }

        .gm-typing-indicator.active {
            display: flex;
            opacity: 1;
            animation: fadeIn 0.3s forwards;
        }

        .gm-dot {
            width: 6px;
            height: 6px;
            background-color: var(--gm-text-gray);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .gm-dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .gm-dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        /* Mobile Responsive */
        @media (max-width: 480px) {
            #gm-chat-window {
                width: calc(100vw - 40px);
                right: 20px;
                bottom: 100px;
                height: 500px;
            }
        }
    </style>
</head>

<body>

    <!-- Widget Container -->
    <div id="gm-widget-container">
        <!-- Floating Trigger Button -->
        <div id="gm-chat-trigger">
            <!-- Icon will be injected by JS or SVG here -->
            <svg id="gm-icon-open" viewBox="0 0 24 24">
                <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z" />
            </svg>
        </div>

        <!-- Chat Window -->
        <div id="gm-chat-window">

            <!-- Header -->
            <div class="gm-header">
                <h2>Grove Media</h2>
                <!-- Reset Button (For Demo/Testing) -->
                <button id="gm-reset-btn" title="Verileri Sıfırla (Test)"
                    style="background: none; border: none; cursor: pointer; color: var(--gm-text-gray); opacity: 0.5; transition: 0.3s; padding: 5px;">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                        <path
                            d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" />
                    </svg>
                </button>
            </div>

            <!-- Screen 1: Lead Form -->
            <div id="gm-form-screen" class="gm-screen active">
                <h1 class="gm-welcome-title">Stratejik Analiz</h1>
                <p class="gm-welcome-subtitle">
                    Size özel dijital büyüme haritası oluşturmak için ilk adımı atın.
                </p>
                <div class="gm-input-group">
                    <input type="text" id="gm-input-name" class="gm-input" placeholder="Adınız Soyadınız">
                </div>
                <div class="gm-input-group">
                    <input type="tel" id="gm-input-phone" class="gm-input" placeholder="Telefon Numaranız (05xx...)">
                </div>
                <button id="gm-start-btn" class="gm-button">Analize Başla</button>
            </div>

            <!-- Screen 2: Chat Interface -->
            <div id="gm-chat-screen" class="gm-screen hidden">
                <div id="gm-chat-history">
                    <!-- Messages will be injected here -->

                    <!-- Typing Indicator -->
                    <div id="gm-typing-indicator" class="gm-typing-indicator">
                        <div class="gm-dot"></div>
                        <div class="gm-dot"></div>
                        <div class="gm-dot"></div>
                    </div>
                </div>

                <div class="gm-input-area">
                    <input type="text" id="gm-message-input" placeholder="Mesajınızı yazın...">
                    <button id="gm-send-btn">
                        <svg viewBox="0 0 24 24">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                        </svg>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Configuration
            const API_ENDPOINT = 'http://45.81.113.14:3001/api/chat'; // Remote Backend IP
            const LOCAL_STORAGE_KEY = 'grove_media_user';

            const LOCAL_STORAGE_HISTORY_KEY = 'grove_media_chat_history';

            // DOM Elements
            const triggerBtn = document.getElementById('gm-chat-trigger');
            const chatWindow = document.getElementById('gm-chat-window');
            const formScreen = document.getElementById('gm-form-screen');
            const chatScreen = document.getElementById('gm-chat-screen');
            const startBtn = document.getElementById('gm-start-btn');
            const nameInput = document.getElementById('gm-input-name');
            const phoneInput = document.getElementById('gm-input-phone');
            const chatHistory = document.getElementById('gm-chat-history');
            const messageInput = document.getElementById('gm-message-input');
            const sendBtn = document.getElementById('gm-send-btn');
            const typingIndicator = document.getElementById('gm-typing-indicator');
            const triggerIcon = triggerBtn.querySelector('svg');

            // State
            let isOpen = false;
            let userData = JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY));
            let messageHistory = JSON.parse(localStorage.getItem(LOCAL_STORAGE_HISTORY_KEY)) || [];

            // Icons
            const iconChat = '<path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>';
            const iconClose = '<path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>';

            // --- Initialization ---

            function init() {
                if (userData) {
                    showChatScreen(true); // true = restoration mode
                } else {
                    showFormScreen();
                }
            }

            // --- Toggle Widget ---

            triggerBtn.addEventListener('click', () => {
                isOpen = !isOpen;

                if (isOpen) {
                    chatWindow.classList.add('active');
                    triggerBtn.classList.add('open');
                    triggerIcon.innerHTML = iconClose;

                    // If chat screen is active, focus input
                    if (chatScreen.classList.contains('active')) {
                        setTimeout(() => messageInput.focus(), 300);
                    }
                } else {
                    chatWindow.classList.remove('active');
                    triggerBtn.classList.remove('open');
                    triggerIcon.innerHTML = iconChat;
                }
            });

            // --- Form Logic ---

            function showFormScreen() {
                formScreen.classList.remove('hidden');
                formScreen.classList.add('active');
                chatScreen.classList.add('hidden');
                chatScreen.classList.remove('active');
            }

            function showChatScreen(isRestoring = false) {
                formScreen.classList.add('hidden');
                formScreen.classList.remove('active');
                chatScreen.classList.remove('hidden');
                chatScreen.classList.add('active');

                // Load History if restoring
                if (isRestoring && messageHistory.length > 0) {
                    // Render existing history
                    // Clear current (except typing indicator) - though usually empty on init
                    // But to be safe, we only append if container is effectively empty of messages
                    const existingMessages = chatHistory.querySelectorAll('.gm-message');
                    if (existingMessages.length === 0) {
                        messageHistory.forEach(msg => {
                            renderMessage(msg.text, msg.type, false); // false = don't save again
                        });
                        scrollToBottom();
                    }
                } else if (chatHistory.querySelectorAll('.gm-message').length === 0) {
                    // New chat: Add initial bot message
                    const firstName = userData.name.split(' ')[0];
                    addBotMessage(`Merhaba ${firstName}, ben Grove Media Strateji Mimarı. Projenizden bahsedin, analiz edelim.`);
                }
            }

            startBtn.addEventListener('click', () => {
                const name = nameInput.value.trim();
                const phone = phoneInput.value.trim();

                if (!name || !phone) {
                    alert('Lütfen tüm alanları doldurun.');
                    return;
                }

                // sGTM / GTM Push
                window.dataLayer = window.dataLayer || [];
                window.dataLayer.push({
                    'event': 'chat_lead_submitted',
                    'user_name': name,
                    'user_phone': phone,
                    'source': 'grove_chat_widget'
                });
                console.log('sGTM Data Pushed:', { name, phone });

                // Save to LocalStorage
                userData = { name, phone };
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(userData));

                // Switch to chat
                showChatScreen(false);
            });

            // --- Chat Logic ---

            function renderMessage(text, type, shouldSave = true) {
                const msgDiv = document.createElement('div');
                msgDiv.classList.add('gm-message');
                msgDiv.classList.add(type === 'user' ? 'gm-message-user' : 'gm-message-bot');
                msgDiv.innerHTML = text; // Changed to innerHTML to support buttons during error display

                // Insert before typing indicator
                chatHistory.insertBefore(msgDiv, typingIndicator);
                scrollToBottom();

                if (shouldSave) {
                    messageHistory.push({ text, type });
                    localStorage.setItem(LOCAL_STORAGE_HISTORY_KEY, JSON.stringify(messageHistory));
                }
            }

            function addBotMessage(text) {
                renderMessage(text, 'bot');
            }

            function addUserMessage(text) {
                renderMessage(text, 'user');
            }

            function scrollToBottom() {
                chatHistory.scrollTop = chatHistory.scrollHeight;
            }

            // Reset Logic
            document.getElementById('gm-reset-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                // Direct reset without confirmation for easier testing
                localStorage.removeItem(LOCAL_STORAGE_KEY);
                localStorage.removeItem(LOCAL_STORAGE_HISTORY_KEY);
                location.reload();
            });

            function showTyping() {
                typingIndicator.classList.add('active');
                typingIndicator.style.display = 'flex';
                scrollToBottom(); // Ensure indicator is visible
            }

            function hideTyping() {
                typingIndicator.classList.remove('active');
                typingIndicator.style.display = 'none';
            }

            async function handleSendMessage() {
                const text = messageInput.value.trim();
                if (!text) return;

                // Security: Prevent sending if no lead data
                if (!userData) {
                    alert("Lütfen önce bilgilerinizi giriniz.");
                    showFormScreen();
                    return;
                }

                // 1. Add User Message
                addUserMessage(text);
                messageInput.value = '';

                // 2. Show Typing Indicator
                showTyping();

                // 3. API Call (Real)
                try {
                    const response = await fetch(API_ENDPOINT, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            message: text,
                            userName: userData.name,
                            userPhone: userData.phone
                        })
                    });

                    const data = await response.json();

                    hideTyping();
                    addBotMessage(data.text); // Botun cevabı

                } catch (error) {
                    console.error("API Hatası:", error);
                    hideTyping();
                    addBotMessage(`Bağlantı kurulamadı.<br><br><a href="https://wa.me/905416834410" target="_blank" style="display:inline-block; background-color:#25D366; color:white; padding:10px 20px; border-radius:24px; text-decoration:none; font-weight:bold; box-shadow: 0 4px 10px rgba(37, 211, 102, 0.4); transition: transform 0.2s;">WhatsApp ile Ulaşın</a>`);
                }
            }

            // Event Listeners for Chat
            sendBtn.addEventListener('click', handleSendMessage);
            messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleSendMessage();
            });

            // Initialize
            init();

            // Render Message Helper (Updated for HTML support)
            function renderMessage(text, type, shouldSave = true) {
                const msgDiv = document.createElement('div');
                msgDiv.classList.add('gm-message');
                msgDiv.classList.add(type === 'user' ? 'gm-message-user' : 'gm-message-bot');
                msgDiv.innerHTML = text; // Changed to innerHTML to support buttons

                // Insert before typing indicator
                chatHistory.insertBefore(msgDiv, typingIndicator);
                scrollToBottom();

                if (shouldSave) {
                    messageHistory.push({ text, type });
                    localStorage.setItem(LOCAL_STORAGE_HISTORY_KEY, JSON.stringify(messageHistory));
                }
            }
</body >

</html >
